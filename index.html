<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Новая вкладка — Спутник</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800&family=Golos+Text:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --yred:#FC3F1D; --sber:#21A038; --sberD:#0F7A2E; --mazon:#005BFF; --hb:#CB11AB;
  --vs:#337DFF; --xam1:#7A5CFF; --xam2:#3E8BFF; --gov:#0D4CD3; --fox:#FF6A2B;
  --ink:#141519; --mut:#8b8f9a; --line:#e7e8ee; --ok:#21A038; --err:#E53935;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:'Golos Text',system-ui,sans-serif;background:#0e0f13;color:var(--ink);overflow:hidden;font-size:15px}
.disp{font-family:'Unbounded','Golos Text',sans-serif}
button{font-family:inherit;font-size:inherit;border:none;background:none;cursor:pointer;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px;outline:none}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#c7cad4;border-radius:8px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#browser{height:100vh;display:flex;flex-direction:column;position:relative;transition:filter .4s}
#browser.dimmed{filter:brightness(.35)}
#titlebar{height:40px;background:#141519;display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.dots{display:flex;gap:7px;margin-right:10px}
.dot{width:12px;height:12px;border-radius:50%;display:block;transition:transform .15s,filter .15s;cursor:pointer}
.dot:hover{transform:scale(1.2);filter:brightness(1.2)}
.dot.dr{background:#ff5f57}.dot.dy{background:#febc2e}.dot.dg{background:#28c840}
#tabs{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
#tabs::-webkit-scrollbar{display:none}
.tab{min-width:120px;max-width:210px;height:32px;background:#23242b;border-radius:9px 9px 0 0;display:flex;align-items:center;gap:7px;padding:0 8px 0 11px;cursor:pointer;color:#9a9daa;font-size:12.5px;transition:background .15s;flex-shrink:0}
.tab:hover{background:#2c2d36}
.tab.on{background:#34363f;color:#fff}
.tab .tfav{width:16px;height:16px;flex-shrink:0;display:flex}
.tab .ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tab .tx{width:18px;height:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#7c7f8b;opacity:0;transition:.15s}
.tab:hover .tx{opacity:1}
.tab .tx:hover{background:#4a4c57;color:#fff}
.newtab{width:28px;height:28px;border-radius:8px;color:#9a9daa;font-size:18px;line-height:1;transition:.15s;flex-shrink:0}
.newtab:hover{background:#2c2d36;color:#fff}
#toolbar{height:46px;background:#1d1e24;display:flex;align-items:center;gap:5px;padding:0 10px;flex-shrink:0;position:relative}
.tbtn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#b9bcc8;transition:.15s;flex-shrink:0}
.tbtn:hover{background:#2e2f38;color:#fff}
.tbtn:active{transform:scale(.9)}
.tbtn.off{opacity:.3;pointer-events:none}
.tbtn svg{width:17px;height:17px}
#addrform{flex:1;height:32px;background:#31323b;border-radius:16px;display:flex;align-items:center;padding:0 6px 0 13px;gap:8px;position:relative;border:1.5px solid transparent;transition:.2s}
#addrform:focus-within{border-color:var(--yred);background:#383945}
#addrform .lock{color:#8b8f9a;display:flex}
#addr{flex:1;background:none;border:none;color:#e8e9ee;font-size:13.5px;min-width:0}
#addr::placeholder{color:#6f7280}
.star{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#8b8f9a}
.star:hover{background:#444654}
.star.on{color:#FFC24B}
#addrSug{position:absolute;top:40px;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.4);padding:8px;display:none;z-index:60;color:var(--ink)}
#addrSug.on{display:block}
#loadbar{height:3px;background:transparent;position:relative;flex-shrink:0;z-index:55}
#loadbar i{position:absolute;top:0;left:0;height:100%;width:0;background:linear-gradient(90deg,var(--yred),#ff9d2c);border-radius:0 4px 4px 0;box-shadow:0 0 12px rgba(252,63,29,.8);opacity:0;transition:opacity .3s}
#bmb{background:#1d1e24;padding:0 12px 7px;display:none;gap:6px;flex-wrap:wrap;flex-shrink:0}
#bmb.on{display:flex}
.bm-chip{display:flex;align-items:center;gap:6px;background:#2b2c34;border-radius:8px;padding:4px 10px;color:#c9cbd4;font-size:12px;transition:.15s}
.bm-chip:hover{background:#3a3b45;color:#fff;transform:translateY(-1px)}
#page{flex:1;overflow-y:auto;overflow-x:hidden;background:#fff;position:relative}
.page{animation:pagein .35s ease}
@keyframes pagein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.popmenu{position:absolute;top:44px;right:8px;background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.35);padding:7px;min-width:250px;display:none;z-index:80;color:var(--ink)}
.popmenu.on{display:block;animation:pop .18s ease}
.pm-it{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:9px;font-size:14px;text-align:left;transition:.12s}
.pm-it:hover{background:#f1f2f6}
.pm-it.danger{color:var(--err)}
.pm-sep{height:1px;background:var(--line);margin:6px 4px}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:11px 20px;font-weight:600;font-size:14.5px;transition:.15s;user-select:none}
.btn:active{transform:scale(.96)}
.btn.prim{background:var(--ink);color:#fff}
.btn.prim:hover{background:#2c2d35}
.btn.red{background:var(--yred);color:#fff}.btn.red:hover{background:#e02f0e}
.btn.ghost{background:#f1f2f6;color:var(--ink)}.btn.ghost:hover{background:#e6e7ee}
.btn.green{background:var(--ok);color:#fff}.btn.green:hover{background:#188a2e}
.btn.blued{background:var(--gov);color:#fff}.btn.blued:hover{background:#0a3dae}
.btn:disabled{opacity:.5;cursor:default}
.inp{width:100%;border:1.5px solid var(--line);border-radius:11px;padding:11px 14px;background:#fff;transition:.15s}
.inp:focus{border-color:var(--ink)}
.lbl{font-size:12px;color:var(--mut);margin:13px 0 5px;font-weight:600;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:10px;padding:7px 14px;background:#f1f2f6;font-size:13.5px;font-weight:500;transition:.15s}
.chip:hover{background:#e6e7ee}
.chip.on{background:var(--ink);color:#fff}

#toasts{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{background:#191a20;color:#fff;padding:12px 20px;border-radius:13px;font-size:14px;box-shadow:0 12px 34px rgba(0,0,0,.35);opacity:0;transform:translateY(16px);transition:.3s;max-width:80vw;text-align:center}
.toast.on{opacity:1;transform:none}
.toast.ok{background:#14662b}.toast.err{background:#a12320}

#modalroot .mbk{position:fixed;inset:0;background:rgba(14,15,19,.55);backdrop-filter:blur(3px);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px;animation:faded .2s ease}
@keyframes faded{from{opacity:0}to{opacity:1}}
.mbox{background:#fff;border-radius:20px;max-width:480px;width:100%;padding:26px;position:relative;animation:mpop .25s cubic-bezier(.2,.9,.3,1.2);max-height:88vh;overflow-y:auto}
.mbox.wide{max-width:640px}
@keyframes mpop{from{opacity:0;transform:scale(.92) translateY(12px)}to{opacity:1;transform:none}}
.mx{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:9px;background:#f1f2f6;font-size:14px;display:flex;align-items:center;justify-content:center;transition:.15s;z-index:2}
.mx:hover{background:#e2e3ea;transform:rotate(90deg)}
.mrow{display:flex;gap:10px;margin-top:20px;justify-content:flex-end;flex-wrap:wrap}
#drawerroot .dbk{position:fixed;inset:0;background:rgba(14,15,19,.45);z-index:190;animation:faded .2s}
.dpanel{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);background:#fff;z-index:195;display:flex;flex-direction:column;animation:drin .3s cubic-bezier(.2,.9,.3,1)}
@keyframes drin{from{transform:translateX(100%)}to{transform:none}}
.dr-hd{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.dr-body{flex:1;overflow-y:auto;padding:14px 20px}
.dr-ft{border-top:1px solid var(--line);padding:16px 20px}

.bigcheck{width:86px;height:86px;border-radius:50%;background:var(--ok);margin:8px auto 18px;display:flex;align-items:center;justify-content:center;animation:chk .5s cubic-bezier(.2,.9,.3,1.4)}
.bigcheck svg{width:44px;height:44px;stroke:#fff;stroke-width:3.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
@keyframes chk{from{transform:scale(0)}to{transform:scale(1)}}
.spin{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

.start{min-height:100%;background:linear-gradient(160deg,#0f1118 0%,#1a1030 45%,#2b0f1d 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:drift 14s ease-in-out infinite alternate}
.o1{width:480px;height:480px;background:#FC3F1D;top:-160px;left:-120px}
.o2{width:420px;height:420px;background:#4534c9;bottom:-140px;right:-90px;animation-delay:-5s}
.o3{width:300px;height:300px;background:#c926a0;top:40%;left:60%;animation-delay:-9s;opacity:.3}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(60px,-50px) scale(1.15)}}
.start-in{position:relative;z-index:2;text-align:center;padding:40px 20px;width:min(860px,94vw)}
#clock{font-size:clamp(52px,9vw,84px);color:#fff;font-weight:800;letter-spacing:2px;text-shadow:0 10px 40px rgba(0,0,0,.4)}
#dateline{color:#c9cbd8;margin-top:2px;font-size:15px;text-transform:capitalize}
.greet{color:#fff;font-size:20px;margin:16px 0 26px;font-weight:600}
.ysearch{display:flex;background:#fff;border-radius:15px;padding:5px;box-shadow:0 16px 50px rgba(0,0,0,.4);position:relative;max-width:640px;margin:0 auto;text-align:left}
.ysearch input{flex:1;border:none;padding:10px 16px;font-size:16px;background:none;color:var(--ink);min-width:0}
.ybtn{background:var(--yred);color:#fff;border-radius:11px;padding:0 24px;font-weight:700;font-size:15px;transition:.15s;flex-shrink:0}
.ybtn:hover{background:#e02f0e}
.ybtn:active{transform:scale(.95)}
.sug{position:absolute;top:calc(100% + 8px);left:0;right:0;background:#fff;border-radius:15px;box-shadow:0 20px 60px rgba(0,0,0,.45);padding:10px;display:none;z-index:50;color:var(--ink);max-height:380px;overflow-y:auto}
.sug.on{display:block;animation:pop .18s ease}
.sug-t{font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--mut);font-weight:800;padding:8px 10px 6px}
.sug-i{display:flex;align-items:center;gap:12px;width:100%;padding:9px 10px;border-radius:11px;text-align:left;transition:.12s}
.sug-i:hover{background:#f4f5f8;transform:translateX(3px)}
.sug-i .si-t{font-weight:600;font-size:14.5px}
.sug-i .si-d{font-size:12px;color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:34px}
.tile{background:rgba(255,255,255,.07);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:16px 8px 13px;display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff;transition:.2s}
.tile:hover{background:rgba(255,255,255,.16);transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.tile:active{transform:scale(.96)}
.tile span{font-size:13px;font-weight:600}
.tile i{font-style:normal;font-size:10.5px;color:rgba(255,255,255,.5)}
.start-foot{margin-top:36px;color:rgba(255,255,255,.4);font-size:12.5px}

.yx{min-height:100%;background:#fff;display:flex;flex-direction:column}
.yx-top{display:flex;justify-content:space-between;align-items:center;padding:14px 26px;gap:12px;flex-wrap:wrap}
.yx-links{display:flex;gap:6px}
.yx-links button{padding:7px 13px;border-radius:9px;color:#444;font-size:14px;transition:.15s}
.yx-links button:hover{background:#f4f5f8}
.yx-right{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.yx-right button{padding:7px 13px;border-radius:9px;color:#444;font-size:14px;transition:.15s;display:flex;align-items:center;gap:6px}
.yx-right button:hover{background:#f4f5f8}
.plusbtn{background:#111;color:#fff !important;font-weight:700}
.plusbtn:hover{background:#333 !important}
.gear{width:36px;height:36px;padding:0 !important;justify-content:center}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--yred),#ff9d2c);color:#fff;font-weight:800;font-size:13px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
.avatar:hover{transform:scale(1.1)}
.yx-hero{display:flex;flex-direction:column;align-items:center;padding:44px 20px 30px}
.yx-search-wrap{width:min(680px,94vw);position:relative;margin-top:26px}
.yx-search{display:flex;border:2.5px solid var(--yred);border-radius:14px;padding:4px;background:#fff;box-shadow:0 10px 34px rgba(252,63,29,.14);position:relative}
.yx-search input{flex:1;border:none;padding:10px 16px;font-size:16px;min-width:0}
.yx-find{background:var(--yred);color:#fff;border-radius:10px;padding:0 28px;font-weight:700;transition:.15s;flex-shrink:0}
.yx-find:hover{background:#e02f0e}
.fs-pill{margin:16px auto 0;display:flex;align-items:center;gap:9px;background:#191a20;color:#fff;padding:10px 22px;border-radius:30px;font-weight:600;font-size:14px;transition:.2s;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.fs-pill:hover{transform:translateY(-2px);box-shadow:0 12px 30px rgba(0,0,0,.35)}
.widgets{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;width:min(920px,94vw);margin:26px auto 0}
.widget{background:#f6f7fa;border-radius:14px;padding:14px 16px;text-align:left;transition:.18s;border:1px solid transparent}
.widget:hover{background:#fff;border-color:var(--line);box-shadow:0 10px 26px rgba(0,0,0,.08);transform:translateY(-2px)}
.widget b{font-size:19px;display:block;font-weight:800}
.widget b i{font-style:normal;font-size:12px;color:var(--mut);font-weight:600}
.widget span{font-size:12.5px;color:var(--mut)}
.plusban{width:min(920px,94vw);margin:22px auto 0;background:linear-gradient(110deg,#17171d,#3d1140 55%,#7a1638);border-radius:18px;padding:22px 26px;color:#fff;display:flex;align-items:center;gap:18px;flex-wrap:wrap;position:relative;overflow:hidden}
.plusban::after{content:'П';position:absolute;right:-14px;top:-38px;font-family:Unbounded;font-size:170px;font-weight:800;color:rgba(255,255,255,.06)}
.plusban h3{font-size:19px}
.plusban p{color:#c9cbd8;font-size:13.5px;margin-top:4px}
.yx-tiles{width:min(920px,94vw);margin:26px auto 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;padding-bottom:14px}
.svc-tile{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:9px;transition:.18s}
.svc-tile:hover{transform:translateY(-4px);box-shadow:0 14px 30px rgba(0,0,0,.1);border-color:transparent}
.svc-tile b{font-size:13.5px}
.svc-tile i{font-style:normal;font-size:11px;color:var(--mut)}
.yx-foot{border-top:1px solid var(--line);margin-top:34px;padding:18px 26px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;color:var(--mut);font-size:13px}
.yx-foot button{color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.yx-foot button:hover{color:var(--ink)}
.yres{max-width:760px;margin:0 auto;padding:20px 22px 60px}
.yres-hd{display:flex;gap:16px;align-items:center;padding-bottom:16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.res-it{padding:18px 4px;border-bottom:1px solid #f0f1f5;text-align:left;display:block;width:100%;transition:.12s}
.res-it:hover{background:#fafbfd}
.res-it .r-url{font-size:12.5px;color:var(--ok);font-weight:600}
.res-it .r-t{font-size:17.5px;color:#1a4fd6;margin:3px 0}
.res-it .r-s{font-size:13.5px;color:#555}
.wthr{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.wday{flex:1;min-width:74px;background:#f6f7fa;border-radius:13px;padding:13px 6px;text-align:center}
.wday .we{font-size:28px}.wday b{display:block;margin-top:5px}.wday span{font-size:12px;color:var(--mut)}

.lisa{min-height:100%;background:linear-gradient(180deg,#fff4ea,#fff);display:flex;flex-direction:column;max-width:760px;margin:0 auto;padding:0 16px}
.l-hd{display:flex;align-items:center;gap:13px;padding:18px 4px;border-bottom:1px solid #f4e2d2}
.l-hd .st{font-size:12.5px;color:var(--mut)}
.l-chat{flex:1;overflow-y:auto;padding:20px 4px;display:flex;flex-direction:column;gap:12px;min-height:300px;max-height:calc(100vh - 330px)}
.l-msg{max-width:76%;padding:12px 16px;border-radius:17px;font-size:14.5px;line-height:1.45;animation:msgin .25s ease}
@keyframes msgin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.l-msg.a{background:#fff;border:1px solid #f2ddca;border-bottom-left-radius:5px;align-self:flex-start}
.l-msg.u{background:linear-gradient(135deg,#FF8A3D,#FF5A1F);color:#fff;border-bottom-right-radius:5px;align-self:flex-end}
.l-chips{display:flex;gap:8px;flex-wrap:wrap;padding:10px 4px}
.l-chips .chip{background:#ffeede;color:#b04510}
.l-chips .chip:hover{background:#ffdfc2}
.l-in{display:flex;gap:8px;padding:10px 0 22px}
.l-in input{flex:1;border:1.5px solid #f0d8c2;border-radius:24px;padding:12px 19px;background:#fff}
.l-in input:focus{border-color:var(--fox)}
.mic,.sendb{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.mic{background:#ffeede;color:var(--fox)}
.mic:hover{background:#ffdfc2}
.mic.listen{animation:pulse 0.7s ease infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15);box-shadow:0 0 0 9px rgba(255,106,43,.18)}}
.sendb{background:var(--fox);color:#fff}
.sendb:hover{background:#e85a1b}
.sendb:active{transform:scale(.9)}

.igry{min-height:100%;background:#12131a;color:#fff;padding:26px 20px 60px}
.ig-hd{display:flex;align-items:center;gap:14px;max-width:900px;margin:0 auto 26px;flex-wrap:wrap}
.ig-back{background:#23242e;border-radius:10px;padding:9px 16px;color:#cfd1da;transition:.15s}
.ig-back:hover{background:#2f3040;color:#fff}
.ig-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;max-width:900px;margin:0 auto}
.gcard{background:#1c1d27;border-radius:20px;padding:24px 20px;text-align:center;border:1px solid #2a2b38;transition:.2s;display:flex;flex-direction:column;gap:10px;align-items:center}
.gcard:hover{transform:translateY(-5px);border-color:#4a4c63;box-shadow:0 16px 40px rgba(0,0,0,.4)}
.gcard .ge{font-size:52px}
.gcard h3{font-size:17px}
.gcard p{font-size:13px;color:#9a9daa;flex:1}
.gcard .btn{background:var(--yred);color:#fff;width:100%}
.gcard .btn:hover{background:#e02f0e}
.gwrap{max-width:640px;margin:0 auto;text-align:center}
.coinbtn{width:190px;height:190px;border-radius:50%;transition:transform .08s;filter:drop-shadow(0 16px 34px rgba(255,190,40,.4))}
.coinbtn:active{transform:scale(.92)}
.cstats{display:flex;gap:10px;justify-content:center;margin:20px 0;flex-wrap:wrap}
.cstat{background:#1c1d27;border:1px solid #2a2b38;border-radius:13px;padding:11px 18px}
.cstat b{font-size:19px;display:block}.cstat span{font-size:12px;color:#9a9daa}
.upgs{display:grid;gap:10px;margin-top:18px}

/* ---------- утилиты ---------- */
function $(s){return document.querySelector(s);}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fmt(n){return Math.round(n).toLocaleString('ru-RU');}

function nowT(t){return new Date(t).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function toast(msg,type){
  var d=document.createElement('div');d.className='toast '+(type||'');d.innerHTML=msg;

};

var SERVICES=[
 {url:'roflyandex.ru',name:'Рофляндекс',desc:'Поиск №1 в Рунете',logo:LOGO.y},

function svcSugHtml(f){
  f=(f||'').toLowerCase();
  var list=SERVICES.filter(function(s){return !f||s.name.toLowerCase().indexOf(f)>=0||s.url.indexOf(f)>=0;});
  var h='<div class="sug-t">Все сервисы РофлОС</div>';
  list.forEach(function(s){
    h+='<button class="sug-i" data-act="go" data-url="'+s.url+'">'+s.logo(30)+'<span><span class="si-t">'+s.name+'</span><br><span class="si-d">'+s.url+' · '+s.desc+'</span></span></button>';
  });
  if(!list.length)h+='<div style="padding:14px;color:#888">Такого сервиса нет. И не будет 🦊</div>';
  return h;
}

/* ---------- браузер ---------- */
var tabs=[{hist:['start'],hi:0,title:'Новая вкладка'}], active=0, loading=false, pageCleanup=null, hooks={}, lastDom=null;
function curTab(){return tabs[active];}
function favicon(url){
  if(url==='start')return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9a9daa" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>';
  var d=url.split('/')[0];var st=SITES[d];
  if(st&&st.fav)return st.fav(16);
  return '🌐';
}
function renderTabs(){
  $('#tabs').innerHTML=tabs.map(function(t,i){
    return '<div class="tab '+(i===active?'on':'')+'" data-act="tab-sw" data-i="'+i+'"><span class="tfav">'+favicon(t.hist[t.hi])+'</span><span class="ttl">'+esc(t.title)+'</span><span class="tx" data-act="tab-close" data-i="'+i+'">✕</span></div>';
  }).join('');
}
function updNav(){var t=curTab();$('#btnBack').classList.toggle('off',t.hi<=0);$('#btnFwd').classList.toggle('off',t.hi>=t.hist.length-1);}
function renderBm(){
  var b=$('#bmb');
  if(!S.bm.length){b.classList.remove('on');b.innerHTML='';return;}
  b.classList.add('on');
  b.innerHTML=S.bm.map(function(u){
    var sv=null;SERVICES.forEach(function(s){if(s.url===u)sv=s;});
    return '<button class="bm-chip" data-act="go" data-url="'+u+'">'+(sv?sv.logo(14):'🌐')+' '+u+'</button>';
  }).join('');
}
function startLoad(url,cb){
  loading=true;var el=$('#loadbar i');
  el.style.transition='none';el.style.width='0%';el.style.opacity='1';
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    el.style.transition='width .45s cubic-bezier(.2,.7,.3,1)';el.style.width='34%';});});
  setTimeout(function(){el.style.width='61%';},380);
  setTimeout(function(){el.style.width='83%';},800);
  setTimeout(function(){el.style.width='100%';setTimeout(function(){el.style.opacity='0';loading=false;cb();},280);},1250);
}
function show(url){
  if(pageCleanup){try{pageCleanup();}catch(e){}pageCleanup=null;}
  var dom=url.split('/')[0];
  if(dom!==lastDom){hooks={};lastDom=dom;}
  var site=SITES[dom]||SITES['__404'];
  var t=curTab();t.title=site.title;renderTabs();
  var pb=$('#page');pb.className='page '+(site.cls||'');
  try{pb.innerHTML=site.render(url);}
  catch(err){pb.innerHTML='<div class="errpanel">Ошибка на странице '+esc(url)+':\n'+esc(err.message)+'</div>';toast('Ошибка: '+err.message,'err');}
  pb.scrollTop=0;
  document.title=t.title+' — Спутник';
  $('#addr').value=url==='start'?'':'https://'+url;
  $('#favIco').innerHTML=favicon(url);
  $('#starBtn').classList.toggle('on',S.bm.indexOf(url)>=0);
  updNav();renderBm();
  if(site.mount){try{site.mount(url);}catch(err){toast('Ошибка интерфейса: '+err.message,'err');}}
}
function go(url){
  if(loading)return;
  var t=curTab();
  if(t.hist[t.hi]===url){startLoad(url,function(){show(url);});return;}
  t.hist=t.hist.slice(0,t.hi+1);t.hist.push(url);t.hi++;
  startLoad(url,function(){show(url);});
}
function navBack(){var t=curTab();if(loading||t.hi<=0)return;t.hi--;startLoad(t.hist[t.hi],function(){show(t.hist[t.hi]);});}
function navFwd(){var t=curTab();if(loading||t.hi>=t.hist.length-1)return;t.hi++;startLoad(t.hist[t.hi],function(){show(t.hist[t.hi]);});}
function rerender(){var t=curTab();show(t.hist[t.hi]);}

/* ---------- поиск ---------- */
function doSearch(q){
  q=(q||'').trim();
  if(!q){toast('Введите хотя бы что-нибудь 🙂');return;}
  var ql=q.toLowerCase(),m=null;
  for(var i=0;i<SERVICES.length;i++){
    if(SERVICES[i].name.toLowerCase().indexOf(ql)>=0||SERVICES[i].url.indexOf(ql)>=0){m=SERVICES[i];break;}
  }

function mountSnake(){
  var cv=$('#snakeCv');if(!cv)return;
  var ctx=cv.getContext('2d'),N=18,SZ=cv.width/N;
  var sn,dir,ndir,food,score=0,alive=false,tm=null;
  function place(){do{food={x:rnd(N),y:rnd(N)};}while(sn.some(function(s){return s.x===food.x&&s.y===food.y;}));}
  function reset(){sn=[{x:9,y:9},{x:8,y:9},{x:7,y:9}];dir={x:1,y:0};ndir=dir;score=0;place();$('#snScore').textContent='0';}
  function draw(){
    ctx.fillStyle='#0f2416';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#e5484d';ctx.fillRect(food.x*SZ+3,food.y*SZ+3,SZ-6,SZ-6);
    sn.forEach(function(s,i){ctx.fillStyle=i===0?'#7ee787':'#3fb95f';ctx.fillRect(s.x*SZ+1,s.y*SZ+1,SZ-2,SZ-2);});
  }
  function step(){
    dir=ndir;var h={x:(sn[0].x+dir.x+N)%N,y:(sn[0].y+dir.y+N)%N};
    if(sn.some(function(s){return s.x===h.x&&s.y===h.y;})){die();return;}
    sn.unshift(h);
    if(h.x===food.x&&h.y===food.y){score++;$('#snScore').textContent=score;if(score>S.game.snakeBest){S.game.snakeBest=score;save();$('#snBest').textContent=score;}place();}
    else sn.pop();
    draw();
  }
  function die(){alive=false;clearInterval(tm);toast('Змейка себя съела. Философский финал 🐍');}
  hooks.snakeStart=function(){reset();alive=true;clearInterval(tm);tm=setInterval(step,130);draw();};
  reset();draw();
  function keys(e){
    var k=e.key.toLowerCase();
    var map={arrowup:{x:0,y:-1},w:{x:0,y:-1},arrowdown:{x:0,y:1},s:{x:0,y:1},arrowleft:{x:-1,y:0},a:{x:-1,y:0},arrowright:{x:1,y:0},d:{x:1,y:0}};
    var d=map[k];if(!d)return;e.preventDefault();
    if(alive&&(d.x!==-dir.x||d.y!==-dir.y))ndir=d;
  }
  document.addEventListener('keydown',keys);
  pageCleanup=function(){clearInterval(tm);document.removeEventListener('keydown',keys);};
}
function mountTTT(){
  var b=Array(9).fill(''),over=false;
  var wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function winner(p){return wins.find(function(w){return w.every(function(i){return b[i]===p;});});}
  function cells(){return $$('#ttGrid .tcell');}
  function paint(){cells().forEach(function(c,i){c.textContent=b[i]==='X'?'❌':b[i]==='O'?'⭕':'';});}
  function status(t){var s=$('#ttStatus');if(s)s.textContent=t;}
  function end(){
    over=true;var wx=winner('X'),wo=winner('O');
    if(wx){S.game.ttt.w++;save();status('🎉 Вы победили! ИИ ушёл думать о жизни.');wx.forEach(function(i){cells()[i].classList.add('win');});}
    else if(wo){S.game.ttt.l++;save();status('🤖 ИИ победил. Он вежливо не радуется.');wo.forEach(function(i){cells()[i].classList.add('win');});}
    else{S.game.ttt.d++;save();status('🤝 Ничья. ИИ предлагает мир.');}
    var w=$('#ttW'),l=$('#ttL');if(w)w.textContent=S.game.ttt.w;if(l)l.textContent=S.game.ttt.l;
  }
  function ai(){
    var empty=[];b.forEach(function(v,i){if(!v)empty.push(i);});
    if(!empty.length)return;
    function tryW(p){for(var k=0;k<empty.length;k++){var i=empty[k];b[i]=p;if(winner(p)){b[i]='';return i;}b[i]='';}return -1;}
    var mv=tryW('O');if(mv<0)mv=tryW('X');
    if(mv<0&&!b[4])mv=4;
    if(mv<0){var c=[0,2,6,8].filter(function(i){return !b[i];});if(c.length)mv=c[rnd(c.length)];}
    if(mv<0)mv=empty[rnd(empty.length)];
    b[mv]='O';paint();
    if(winner('O')||!b.some(function(v){return !v;}))end();else status('Ваш ход!');
  }
  hooks.tttCell=function(i){
    if(over||b[i])return;
    b[i]='X';paint();
    if(winner('X')||!b.some(function(v){return !v;})){end();return;}
    status('ИИ думает…');setTimeout(ai,420);
  };
  hooks.tttReset=function(){b=Array(9).fill('');over=false;paint();status('Ваш ход — вы играете ❌');};
}

function doPayCheckout(site){
  var h=hooks.co;if(!h)return;
  var cfg=CFGS[site],cart=S.carts[site];
  var useNew=(!S.card||hooks.pm==='new');
  var card=S.card;
  if(useNew){
    var n=($('#ccNum').value||'').replace(/\s/g,'');
    var nm=$('#ccName').value.trim(),ex=$('#ccExp').value,cvc=$('#ccCvc').value;
    if(n.length!==16){toast('Номер карты: нужно 16 цифр 💳','err');return;}
    if(nm.length<3){toast('Введите имя на карте','err');return;}
    if(!/^\d{2}\/\d{2}$/.test(ex)||+ex.slice(0,2)<1||+ex.slice(0,2)>12){toast('Срок в формате ММ/ГГ','err');return;}
    if(!/^\d{3}$/.test(cvc)){toast('CVC — три цифры с обратной стороны','err');return;}
    card={n:n,name:nm.toUpperCase()};
    if($('#ccSave').checked){S.card=card;toast('Карта сохранена в РофлОС 💾','ok');}
  }
  var c=h.calc(hooks.dlv);
  if(!pay(c.total,'Покупка в '+cfg.name+' ('+cartCount(cfg)+' шт.)','🛍️'))return;
  if(S.plus){var cb=Math.max(1,Math.round(c.total*0.01));gain(cb,'Кэшбэк Плюс: '+cfg.name,'💜');}
  cart.forEach(function(i){var p=null;cfg.products.forEach(function(x){if(x.id===i.id)p=x;});
    S.purchases.push({site:cfg.name,item:p.name,price:p.price,qty:i.qty,t:Date.now()});});
  S.carts[site]=[];var order=S.orderSeq++;save();
  h.step3('0'+String(order).padStart(6,'0'));
}

function chatListHtml(filter){
  var ids=Object.keys(S.chats).filter(function(id){return S.deletedChats.indexOf(id)<0;});
  var rows=[];
  ids.forEach(function(id){
    var c=null;CONTACTS.forEach(function(x){if(x.id===id)c=x;});
    if(!c)return;
    var last=S.chats[id][S.chats[id].length-1];
    if(filter&&c.name.toLowerCase().indexOf(filter)<0)return;
    rows.push({id:id,c:c,last:last});
  });
  rows.sort(function(a,b){return b.last.t-a.last.t;});
  if(!rows.length)return '<div style="padding:20px;color:var(--mut);font-size:13.5px">Ничего не найдено</div>';
  return rows.map(function(x){
    return '<button class="x-item '+(hooks.xChat===x.id?'on':'')+'" data-act="x-chat" data-id="'+x.id+'">'+
    '<div class="x-av" style="background:'+x.c.col+'">'+x.c.av+'</div>'+
    '<div class="x-mid"><b>'+x.c.name+'</b><span>'+esc((x.last?x.last.text:'').slice(0,42))+'</span></div>'+
    (S.unread[x.id]?'<span class="x-n">'+S.unread[x.id]+'</span>':'')+'</button>';
  }).join('');
}

function xamSend(){
  var id=hooks.xChat;if(!id)return;

  if(id==='goss'){toast('Вы не можете писать в канал. Никто не может. 🏛️','err');return;}

function botReply(id,text){
  var t=(text||'').toLowerCase();
  if(id==='scam'){
    var tokens=t.replace(/,/g,' ').split(/\s+/);
    var has3=tokens.some(function(x){return /^\d{3}$/.test(x);});
    if(has3){pay(1000,'Списание через XAM (сами отправили CVC)','🎣');
      return '✅ Готово! С вашей карты списано 1 000 ₽. Спасибо за бдительность! Возвраты: вторник, с 03:00 до 03:05.';}
    if(/\d{12,}/.test(t.replace(/\s/g,'')))return 'Спасибо за номер карты! Теперь нужен CVC — три цифры с обратной стороны. Мы никому не скажем. 🤝';
    if(/верн|обман|мошенн/.test(t))return 'Конечно, оформляем возврат! Заявка № 0. Срок рассмотрения: никогда. Хорошего дня! 😊';
    if(/привет/.test(t))return 'Здравствуйте! Ваш счёт под угрозой ОЧЕНЬ. Настолько, что страшно нам самим.';
    return 'Оператор ответит вам через 87 лет. Ваша позиция в очереди: 4 832 911. Оставайтесь с нами.';
  }
  if(id==='mama'){if(/привет/.test(t))return 'Привет, солнышко! Покушал?';
    return ['Ты покушал?','Шапку надень!','Когда в гости? Я борщ сварила','Я тебе в Хаме пишу, а ты в Хаме и сидишь'][rnd(4)];}
  if(id==='work')return ['Коллеги, апнем эту тему?','+','Это надо было ещё вчера','Давайте созвон на 5 минут (затянется на час)','А кто за это отвечает?'][rnd(5)];
  if(id==='viktor')return ['Здорово! Ты гараж видел?','Картошка в этом году — огонь 🥔','Раньше было лучше. И интернет тоже, хотя его не было'][rnd(3)];
  if(id==='dlv')return ['Ваш заказ передан куратору… то есть курьеру.','Курьер рядом. Чувствуете запах пакета?','ПВЗ закрыт на переучёт пакетов'][rnd(3)];
  if(id==='lisa')return lisaReply(text);
  return '…';
}

 'unlink-card':function(){confirmBox('Отвязать карту?','Маркетплейсы перестанут её помнить. Они будут скучать.',true,function(){S.card=null;save();rerender();toast('Карта отвязана');});},
 /* маркетплейсы */
 'mk-cat':function(el){var c=CFGS[el.dataset.site];c._cat=el.dataset.cat;rerender();},
 'prod-open':function(el){
  var cfg=CFGS[el.dataset.site],p=null;
  cfg.products.forEach(function(x){if(x.id===el.dataset.id)p=x;});
  if(!p)return;
  hooks.qty=1;
  modal('<button class="mx" data-close>✕</button>'+
  '<div class="pimg" style="height:210px;border-radius:16px;background:linear-gradient(135deg,'+p.bg[0]+','+p.bg[1]+');font-size:96px">'+p.emoji+'</div>'+
  '<h3 style="margin:16px 0 4px;font-size:19px;line-height:1.35">'+p.name+'</h3>'+
  '<div style="color:#f5a300;font-weight:700">★ '+p.r+' <span style="color:var(--mut);font-weight:500">· '+p.rv+' отзывов · '+p.cat+'</span></div>'+
  '<p style="margin:12px 0;line-height:1.55;color:#444">'+p.d+'</p>'+
  '<div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap"><span style="font-family:Unbounded;font-size:24px;font-weight:800">'+rub(p.price)+'</span>'+(p.old?'<s style="color:var(--mut)">'+rub(p.old)+'</s>':'')+
  '<div class="qty" style="margin-left:auto"><button data-act="pm-qty" data-d="-1">−</button><b id="pmQty">1</b><button data-act="pm-qty" data-d="1">+</button></div></div>'+
  '<p style="font-size:12.5px;color:var(--mut);margin-top:8px">🚚 Доставка завтра · '+(S.plus?'бесплатно по Плюсу':'курьером 199 ₽')+'</p>'+
  '<div style="display:flex;gap:10px;margin-top:16px"><button class="btn ghost" style="flex:1" data-act="pm-add" data-site="'+cfg.id+'" data-id="'+p.id+'">В корзину</button><button class="btn" style="flex:1;background:'+cfg.accent+';color:#fff" data-act="pm-buy" data-site="'+cfg.id+'" data-id="'+p.id+'">Купить сейчас</button></div>');
 },
 'pm-qty':function(el){hooks.qty=Math.max(1,(hooks.qty||1)+(+el.dataset.d));var q=$('#pmQty');if(q)q.textContent=hooks.qty;},
 'add-cart':function(el){addToCart(el.dataset.site,el.dataset.id);},
 'pm-add':function(el){addToCart(el.dataset.site,el.dataset.id,hooks.qty||1);closeModal();},
 'pm-buy':function(el){addToCart(el.dataset.site,el.dataset.id,hooks.qty||1);closeModal();openCart(CFGS[el.dataset.site]);},
 'cart-open':function(el){openCart(CFGS[el.dataset.site]);},
 'q-ch':function(el){
  var cart=S.carts[el.dataset.site],it=null;
  cart.forEach(function(i){if(i.id===el.dataset.id)it=i;});
  if(!it)return;
  it.qty+=+el.dataset.d;
  if(it.qty<=0)cart.splice(cart.indexOf(it),1);
  save();openCart(CFGS[el.dataset.site]);renderGrid(CFGS[el.dataset.site]);
 },
 'q-rm':function(el){
  var cart=S.carts[el.dataset.site],it=null;
  cart.forEach(function(i){if(i.id===el.dataset.id)it=i;});
  if(it)cart.splice(cart.indexOf(it),1);
  save();openCart(CFGS[el.dataset.site]);renderGrid(CFGS[el.dataset.site]);
 },
 'checkout-open':function(el){openCheckout(CFGS[el.dataset.site]);},
 'co-dlv':function(el){hooks.dlv=el.dataset.v;if(hooks.co)hooks.co.step1();},
 'co-pm':function(el){
  hooks.pm=el.dataset.v;
  var nb=$('#newCardBox');if(nb)nb.style.display=el.dataset.v==='new'?'block':'none';
  $$('.payopt').forEach(function(p){p.classList.remove('on');});
  el.classList.add('on');
 },
 'co-next':function(el){
  var city=$('#coCity').value.trim(),st=$('#coStreet').value.trim();
  if(!city||!st){toast('Заполните адрес доставки','err');return;}
  S.addr={city:city,street:st};save();
  if(hooks.co)hooks.co.step2();
 },
 'co-back':function(){if(hooks.co)hooks.co.step1();},
 'co-pay':function(el){doPayCheckout(el.dataset.site);},
 'mk-track':function(){toast('📦 Посылка уже едет. Вероятно. В каком-то смысле.');},
 'mk-profile':function(el){
  var cfg=CFGS[el.dataset.site];
  var list=S.purchases.filter(function(p){return p.site===cfg.name;});
  var h='';
  list.forEach(function(p){h+='<div class="ledger-it"><span class="li">📦</span><div class="ld"><b>'+esc(p.item)+'</b><span>'+nowT(p.t)+' · '+p.qty+' шт.</span></div><span class="la minus">− '+rub(p.price*p.qty)+'</span></div>';});
  modal('<button class="mx" data-close>✕</button><div style="text-align:center"><div class="avatar" style="width:64px;height:64px;font-size:22px;margin:0 auto;background:'+cfg.accent+'">'+esc(S.profile.name.split(' ').map(function(w){return w[0];}).join(''))+'</div><h3 style="margin:10px 0 3px">'+esc(S.profile.name)+'</h3><p style="color:var(--mut);font-size:13px">ivan@roflyandex.ru '+(S.plus?'· 💜 Плюс активен':'')+'</p></div>'+
  '<h4 style="margin:18px 0 8px">Заказы в '+cfg.name+': '+list.length+'</h4>'+
  (h||'<p style="color:var(--mut);font-size:14px">Покупок пока нет. Самое время.</p>')+
  '<p style="margin-top:12px;font-size:13px;color:var(--mut)">Всего потрачено: <b style="color:var(--ink)">'+rub(list.reduce(function(a,p){return a+p.price*p.qty;},0))+'</b></p>'+
  '<div class="mrow"><button class="btn prim" data-close>Закрыть</button></div>');
 },
 /* вирустор */
 'vs-tab':function(el){hooks.vsTab=el.dataset.t;rerender();},
 'vs-install':function(el){var id=el.dataset.id;if(S.apps[id])return;S.apps[id]='ing';save();simulateInstall(id,el);},
 'vs-open':function(el){openApp(el.dataset.id);},
 'vs-uninstall':function(el){
  var a=null;APPS.forEach(function(x){if(x.id===el.dataset.id)a=x;});
  confirmBox('Удалить «'+a.n+'»?','Приложение будет скучать. Оно уже привязалось.',true,function(){delete S.apps[el.dataset.id];save();rerender();toast('Приложение удалено 🗑');});
 },
 'torch-tog':function(){
  var on=$('#browser').classList.toggle('dimmed');
  var b=$('#torchBtn'),i=$('#torchIc');
  if(b)b.textContent=on?'Выключить фонарик':'Включить фонарик';
  if(i)i.textContent=on?'💡':'🔦';
  toast(on?'Фонарик включён! Но подсветил только темноту 💡':'Фонарик выключен');
 },
 /* xam */
 'x-chat':function(el){hooks.xChat=el.dataset.id;S.unread[el.dataset.id]=0;save();rerender();},
 'x-new':function(){
  var h='';CONTACTS.forEach(function(c){h+='<button class="pm-it" data-act="x-pick" data-id="'+c.id+'"><span style="width:38px;height:38px;border-radius:50%;background:'+c.col+';display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0">'+c.av+'</span><span><b style="font-size:14px">'+c.name+'</b><br><span style="font-size:12px;color:var(--mut)">'+c.status+'</span></span></button>';});
  modal('<button class="mx" data-close>✕</button><h3 style="margin-bottom:10px">Контакты</h3>'+h,'wide');
 },
 'x-pick':function(el){
  var id=el.dataset.id;
  if(!S.chats[id])S.chats[id]=[{me:0,text:'Привет! Это новое начало 🌱',t:Date.now()}];
  S.deletedChats=S.deletedChats.filter(function(x){return x!==id;});
  hooks.xChat=id;S.unread[id]=0;save();closeModal();rerender();
 },
 'x-send':xamSend,
 'x-emoji':function(){var p=$('#emojiPop');if(p)p.classList.toggle('on');},
 'x-emoji-pick':function(el){var i=$('#xIn');if(i){i.value+=el.dataset.e;i.focus();}},
 'x-attach':function(){toast('Файл слишком большой. Максимум — 2 байта 📎','err');},
 'x-menu':function(el){
  var id=el.dataset.id,c=null;CONTACTS.forEach(function(x){if(x.id===id)c=x;});
  modal('<button class="mx" data-close>✕</button><h3 style="margin-bottom:10px">Чат: '+c.name+'</h3><button class="pm-it" data-act="x-clear" data-id="'+id+'">🧹 Очистить историю</button><button class="pm-it danger" data-act="x-del" data-id="'+id+'">🗑 Удалить чат</button>');
 },
 'x-clear':function(el){S.chats[el.dataset.id]=[];save();closeModal();rerender();toast('История очищена 🧹');},
 'x-del':function(el){
  var id=el.dataset.id;
  if(S.deletedChats.indexOf(id)<0)S.deletedChats.push(id);
  delete S.chats[id];delete S.unread[id];
  hooks.xChat=null;save();closeModal();rerender();toast('Чат удалён');
 },
 /* услуги */
 'gov-login':function(el){
  el.disabled=true;el.innerHTML='<span class="spin"></span> Проверяем документы…';
  setTimeout(function(){S.gov.logged=true;save();toast('Добро пожаловать, '+esc(S.profile.name)+'! 🏛️','ok');rerender();},1300);
 },
 'gov-logout':function(){S.gov.logged=false;save();rerender();toast('Вы вышли. Государство будет помнить.');},
 'gov-tile':function(el){hooks.govSec=el.dataset.t;rerender();},
 'gov-notif':function(){modal('<button class="mx" data-close>✕</button><h3 style="margin-bottom:10px">Уведомления</h3><div style="line-height:1.7;font-size:14px">🔔 Вам начислена справка (2019)<br>🔔 Вам начислена справка о справке (2021)<br>🔔 Вам начислена гордость (2026)</div><div class="mrow"><button class="btn blued" data-act="gov-notif-read">Отметить прочитанными</button></div>');},
 'gov-notif-read':function(){closeModal();toast('Уведомления прочитаны. Новые уже начислены 🔔');},
 'fine-pay':function(el){
  var f=null;S.gov.fines.forEach(function(x){if(x.id===el.dataset.id)f=x;});
  if(!f||f.paid)return;
  var sum=Math.round(f.sum/2);
  if(pay(sum,'Штраф ГИБДД: '+f.txt,'🚔')){f.paid=true;save();toast('Штраф оплачен со скидкой 50% ✓','ok');$('#govSection').innerHTML=renderGov.section('fines');}
 },
 'pp-show':function(){S.gov.ppOpen=!S.gov.ppOpen;save();$('#govSection').innerHTML=renderGov.section('pp');},
 'pp-replace':function(){confirmBox('Заменить паспорт?','Новый паспорт будет готов через 10 лет. Или через 11, если пойдёт не по плану.',false,function(){S.gov.replaced=1;save();$('#govSection').innerHTML=renderGov.section('pp');toast('Заявление подано ✓','ok');});},
 'spr-gen':function(){
  modal('<button class="mx" data-close>✕</button><div class="spravka"><h3>СПРАВКА</h3><p style="text-align:center;margin-bottom:20px">№ '+(rnd(900000)+100000)+' от '+new Date().toLocaleDateString('ru-RU')+'</p><p style="line-height:1.9">Настоящим подтверждается, что гражданин <span class="stx">'+esc(S.profile.name)+'</span> действительно имеет справку о наличии у него данной справки.</p><p style="line-height:1.9;margin-top:12px">Справка выдана для предъявления по месту требования справки.</p><div class="stamp2">ОДОБРЕНО<br>· 2026 ·</div></div><div class="mrow"><button class="btn ghost" data-act="spr-dl">⬇️ Скачать</button><button class="btn prim" data-close>Закрыть</button></div>','wide');
 },
 'spr-dl':function(){
  var txt='СПРАВКА №424242 от '+new Date().toLocaleDateString('ru-RU')+'\n\nНастоящим подтверждается, что гражданин '+S.profile.name+' имеет справку о наличии данной справки.\n\nПодпись: /размазано/\nПечать: ОДОБРЕНО';
  var blob=new Blob([txt],{type:'text/plain'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='spravka.txt';a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},2000);
  toast('Справка скачана. Сохраните в надёжном месте 📜','ok');
 },
 'doc-apply':function(){S.gov.doc={spec:$('#docSpec').value,time:$('#docTime').value};save();$('#govSection').innerHTML=renderGov.section('doc');toast('Вы записаны к врачу 🩺','ok');},
 'doc-cancel':function(){S.gov.doc=null;save();$('#govSection').innerHTML=renderGov.section('doc');toast('Запись отменена. Врач не расстроился.');}
};
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act],[data-close]');
  if(!el)return;
  if(el.hasAttribute('data-close')){closeModal();closeDrawer();return;}
  var fn=ACTS[el.dataset.act];
  if(fn){try{fn(el,e);}catch(err){toast('Ошибка действия: '+err.message,'err');}}
});

/* ---------- адресная строка ---------- */
$('#addrform').addEventListener('submit',function(e){
  e.preventDefault();
  var v=$('#addr').value.trim().replace(/^https?:\/\//,'').replace(/\/+$/,'');
  $('#addrSug').classList.remove('on');
  if(!v){doSearch('');return;}
  var dom=v.split('/')[0].toLowerCase();
  if(SITES[dom])go(dom+(v.indexOf('/')>=0?'/'+v.split('/').slice(1).join('/'):''));
  else doSearch(v);
});
function addrDraw(){
  var f=$('#addr').value.toLowerCase().replace(/^https?:\/\//,'');
  var list=SERVICES.filter(function(s){return !f||s.url.indexOf(f)>=0||s.name.toLowerCase().indexOf(f)>=0;});
  var h='<div class="sug-t">Сервисы</div>';
  list.forEach(function(s){h+='<button class="sug-i" data-act="go" data-url="'+s.url+'">'+s.logo(26)+'<span><b style="font-size:14px">'+s.name+'</b> <span style="font-size:12px;color:var(--mut)">· '+s.url+'</span></span></button>';});
  if(!list.length)h+='<div style="padding:12px;color:#888;font-size:13.5px">Enter — поиск в Рофляндексе</div>';
  $('#addrSug').innerHTML=h;$('#addrSug').classList.add('on');
}
$('#addr').addEventListener('focus',addrDraw);
$('#addr').addEventListener('input',addrDraw);
document.addEventListener('click',function(e){if(!e.target.closest('#addrform'))$('#addrSug').classList.remove('on');});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeDrawer();}});

/* ---------- старт ---------- */
save();
renderTabs();
show('start');
</script>
</body>
